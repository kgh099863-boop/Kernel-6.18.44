name: Alpine KVM Boot Benchmark

on:
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest

    steps:
      - name: Check KVM
        run: |
          set -eux
          test -e /dev/kvm
          ls -l /dev/kvm
          kvm-ok || true

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Download Alpine Virt
        run: |
          curl -fL \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-virt-3.24.1-x86_64.iso \
            -o alpine.iso

          sha256sum alpine.iso

      - name: Boot Alpine with KVM
        run: |
          set -e

          START=$(date +%s%N)

          sudo timeout 15s \
            qemu-system-x86_64 \
            -accel kvm \
            -cpu host \
            -machine q35 \
            -m 512M \
            -smp 2 \
            -cdrom alpine.iso \
            -boot d \
            -nographic \
            -serial mon:stdio \
            -no-reboot \
            2>&1 | tee qemu.log || true

          END=$(date +%s%N)

          ELAPSED=$(( (END - START) / 1000000 ))

          echo "================================"
          echo "QEMU runtime: ${ELAPSED} ms"
          echo "================================"

      - name: Show boot log
        if: always()
        run: |
          cat qemu.log
