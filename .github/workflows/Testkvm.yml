name: Android-x86 9 VM

on:
  workflow_dispatch:

jobs:
  android-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECK KVM
      # ============================================================
      - name: Check and enable KVM
        shell: bash
        run: |
          set -eux

          echo "=== CPU ==="
          lscpu

          echo
          echo "=== KVM ==="
          ls -l /dev/kvm

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm does not exist"
            exit 1
          fi

          echo "Fixing KVM permissions..."

          sudo chgrp kvm /dev/kvm || true
          sudo chmod 666 /dev/kvm

          echo
          echo "=== KVM permissions after fix ==="
          ls -l /dev/kvm

          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "ERROR: /dev/kvm still cannot be accessed"
            exit 1
          fi

          echo "KVM device is accessible"

          # Directly test opening /dev/kvm
          python3 - <<'PY'
          import os

          fd = os.open("/dev/kvm", os.O_RDWR)
          print("SUCCESS: /dev/kvm opened")
          os.close(fd)
          PY


      # ============================================================
      # 2. INSTALL PACKAGES
      # ============================================================
      - name: Install QEMU and dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            qemu-kvm \
            wget \
            curl \
            git \
            unzip \
            python3 \
            python3-pip \
            netcat-openbsd

          echo
          echo "=== QEMU VERSION ==="
          qemu-system-x86_64 --version

          echo
          echo "=== QEMU KVM SUPPORT ==="
          qemu-system-x86_64 -accel help


      # ============================================================
      # 3. DOWNLOAD ANDROID-X86
      # ============================================================
      - name: Download Android-x86 9.0-r2
        shell: bash
        run: |
          set -eux

          wget \
            -O android-x86.iso \
            "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          ls -lh android-x86.iso

          echo
          echo "=== SHA1 ==="
          sha1sum android-x86.iso

          EXPECTED="1cc85b5ed7c830ff71aecf8405c7281a9c995aa0"
          ACTUAL="$(sha1sum android-x86.iso | awk '{print $1}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: ISO checksum mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Android-x86 ISO checksum OK"


      # ============================================================
      # 4. CREATE VIRTUAL DISK
      # ============================================================
      - name: Create Android virtual disk
        shell: bash
        run: |
          set -eux

          qemu-img create \
            -f qcow2 \
            android-x86.qcow2 \
            16G

          qemu-img info android-x86.qcow2


      # ============================================================
      # 5. INSTALL NOVNC
      # ============================================================
      - name: Install noVNC
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch v1.7.0 \
            https://github.com/novnc/noVNC.git

          cd noVNC

          python3 -m pip install \
            --user \
            websockify

          chmod +x utils/novnc_proxy

          cd ..

          echo "noVNC installed"


      # ============================================================
      # 6. START QEMU
      # ============================================================
      - name: Start Android-x86
        shell: bash
        run: |
          set -eux

          rm -f qemu.log
          rm -f qemu.pid

          echo "Starting Android-x86 with KVM..."

          qemu-system-x86_64 \
            -enable-kvm \
            -machine type=q35,accel=kvm \
            -cpu host \
            -smp 4 \
            -m 4096 \
            -drive file=android-x86.qcow2,format=qcow2,if=virtio \
            -cdrom android-x86.iso \
            -boot d \
            -vga virtio \
            -device virtio-keyboard-pci \
            -device virtio-mouse-pci \
            -display none \
            -vnc 127.0.0.1:0 \
            -daemonize \
            -pidfile qemu.pid \
            -D qemu.log

          sleep 5

          echo
          echo "=== QEMU PROCESS ==="
          ps aux | grep '[q]emu-system-x86_64' || true

          echo
          echo "=== QEMU LOG ==="
          cat qemu.log || true

          if [ ! -f qemu.pid ]; then
            echo "ERROR: QEMU did not start"
            exit 1
          fi

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "ERROR: QEMU process died"
            cat qemu.log || true
            exit 1
          fi

          echo
          echo "QEMU started successfully"
          echo "VNC = 127.0.0.1:5900"


      # ============================================================
      # 7. WAIT FOR VNC
      # ============================================================
      - name: Wait for VNC
        shell: bash
        run: |
          set -eux

          echo "Waiting for QEMU VNC..."

          for i in $(seq 1 60); do

            if nc -z 127.0.0.1 5900; then
              echo "VNC is ready"
              exit 0
            fi

            echo "Waiting... $i/60"

            sleep 2
          done

          echo "ERROR: VNC did not start"

          cat qemu.log || true

          exit 1


      # ============================================================
      # 8. START NOVNC
      # ============================================================
      - name: Start noVNC
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/.local/bin:$PATH"

          ./noVNC/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          echo
          echo "=== noVNC LOG ==="

          cat novnc.log || true

          if ! nc -z 127.0.0.1 6080; then
            echo "ERROR: noVNC did not start"
            exit 1
          fi

          echo
          echo "noVNC is ready"
          echo "Local address:"
          echo "http://127.0.0.1:6080/vnc.html"


      # ============================================================
      # 9. INSTALL CLOUDFLARED
      # ============================================================
      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -eux

          wget \
            -O cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"

          chmod +x cloudflared

          ./cloudflared version


      # ============================================================
      # 10. START CLOUDFLARE QUICK TUNNEL
      # ============================================================
      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -eux

          rm -f cloudflared.log

          ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo
          echo "Waiting for Cloudflare URL..."

          URL=""

          for i in $(seq 1 60); do

            URL=$(grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              cloudflared.log \
              | head -1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          echo
          echo "=================================================="
          echo "          ANDROID-x86 WEB ACCESS"
          echo "=================================================="

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL not found"
            echo
            cat cloudflared.log
            exit 1
          fi

          echo
          echo "OPEN THIS URL:"
          echo
          echo "$URL/vnc.html"
          echo
          echo "=================================================="

          echo "$URL/vnc.html" > novnc-url.txt


      # ============================================================
      # 11. SHOW STATUS
      # ============================================================
      - name: Show VM status
        shell: bash
        run: |
          set -eux

          echo
          echo "================ VM STATUS ================"

          echo
          echo "--- KVM ---"
          ls -l /dev/kvm

          echo
          echo "--- QEMU ---"
          ps aux | grep '[q]emu-system-x86_64' || true

          echo
          echo "--- noVNC ---"
          ps aux | grep '[n]ovnc_proxy' || true

          echo
          echo "--- Cloudflare ---"
          ps aux | grep '[c]loudflared' || true

          echo
          echo "--- Ports ---"
          ss -lntp || true

          echo
          echo "--- URL ---"
          cat novnc-url.txt || true

          echo
          echo "============================================"


      # ============================================================
      # 12. KEEP RUNNING
      # ============================================================
      - name: Keep Android VM alive
        shell: bash
        run: |
          set -eux

          echo
          echo "Android-x86 is running."
          echo
          echo "Web URL:"
          cat novnc-url.txt
          echo
          echo "Keep this workflow running."
          echo "Maximum runtime is limited by GitHub Actions."

          while true; do

            echo
            echo "======================================"
            date

            echo
            echo "--- QEMU ---"
            ps aux | grep '[q]emu-system-x86_64' || true

            echo
            echo "--- noVNC ---"
            ps aux | grep '[n]ovnc_proxy' || true

            echo
            echo "--- Cloudflare ---"
            ps aux | grep '[c]loudflared' || true

            echo
            echo "--- URL ---"
            cat novnc-url.txt || true

            sleep 60

          done
