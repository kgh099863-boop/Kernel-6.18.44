name: Build Linux 6.18.44 ARM64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves cpio rsync kmod fakeroot \
            crossbuild-essential-arm64

      - name: Prepare ARM64 config
        run: |
          make ARCH=arm64 defconfig

      - name: Enable features
        run: |
          ./scripts/config --enable CONFIG_64BIT
          ./scripts/config --enable CONFIG_ARM64
          ./scripts/config --enable CONFIG_SMP
          ./scripts/config --enable CONFIG_PREEMPT
          ./scripts/config --enable CONFIG_MODULES

          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_DEBUG_INFO

          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_F2FS_FS
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_VFAT_FS

          ./scripts/config --enable CONFIG_NETFILTER
          ./scripts/config --enable CONFIG_TCP_CONG_BBR

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL

          ./scripts/config --enable CONFIG_CGROUPS
          ./scripts/config --enable CONFIG_NAMESPACES
          ./scripts/config --enable CONFIG_SECCOMP

          ./scripts/config --enable CONFIG_BLK_DEV_DM
          ./scripts/config --enable CONFIG_KVM

          make ARCH=arm64 olddefconfig

      - name: Build Kernel Image
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Build Modules
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      - name: Build DTBs
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbs

      - name: Prepare files
        run: |
          mkdir -p release/kernel
          mkdir -p release/modules
          mkdir -p release/dtbs
          mkdir -p release/config

          cp arch/arm64/boot/Image \
            release/kernel/Image

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$PWD/release/modules" \
            modules_install

          find arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} release/dtbs/ \; || true

          cp .config release/config/.config

          echo "Linux $(make ARCH=arm64 kernelversion)" \
            > release/config/build-info.txt

      # -------------------------------
      # Separate downloadable artifacts
      # -------------------------------

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: release/kernel/Image
          retention-days: 7

      - name: Compress Modules
        run: |
          tar -czf modules.tar.gz -C release/modules .

      - name: Upload Modules
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules
          path: modules.tar.gz
          retention-days: 7

      - name: Compress DTBs
        run: |
          tar -czf dtbs.tar.gz -C release/dtbs .

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-DTBS
          path: dtbs.tar.gz
          retention-days: 7

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Config
          path: release/config
          retention-days: 7

      # -------------------------------
      # Full package
      # -------------------------------

      - name: Create Full Package
        run: |
          tar -czf kernel-full.tar.gz \
            -C release .

      - name: Upload Full Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Full
          path: kernel-full.tar.gz
          retention-days: 7

      # -------------------------------
      # GitHub Release
      # -------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-6.18.44-arm64-${{ github.run_number }}
          name: Linux 6.18.44 ARM64 Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/kernel/Image
            modules.tar.gz
            dtbs.tar.gz
            release/config/.config
            kernel-full.tar.gz
